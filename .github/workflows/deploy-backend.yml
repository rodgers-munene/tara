name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/scripts/deploy.sh"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  INSTANCE_ID: i-0973b3158304d2e4c

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::293528979166:role/tara-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command via SSM
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo bash /opt/tara/infra/scripts/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        run: |
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for deploy to finish"
          exit 1
